<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio</title>

<style>

/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(
        135deg,
        #f5e9ff,
        #e9d5ff,
        #d8b4fe
    );

    min-height:100vh;
    padding:40px;
    overflow-x:hidden;
}

/* อิโมจิลอย */

.floating{
    position:fixed;
    font-size:2rem;
    opacity:.7;
    animation:float 15s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
    }

    to{
        transform:translateY(-120vh);
    }
}

.f1{left:5%;animation-delay:0s;}
.f2{left:20%;animation-delay:3s;}
.f3{left:40%;animation-delay:6s;}
.f4{left:60%;animation-delay:9s;}
.f5{left:80%;animation-delay:12s;}


/* CONTAINER */

.container{
    max-width:1000px;
    margin:auto;
    position:relative;
    z-index:10;
}


/* HEADER */

.header{
    background:rgba(255,255,255,.85);

    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:30px;

    margin-bottom:25px;

    box-shadow:
        0 10px 25px rgba(0,0,0,.08);

    text-align:center;
}

.header-text h1{
    color:#7e22ce;
}

.header-text p{
    color:#666;
    margin-top:10px;
}


/* CARD */

.project-card{
    background:rgba(255,255,255,.9);

    border-radius:25px;

    padding:25px;

    margin-bottom:25px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.08);
}

.project-card h3{
    color:#7e22ce;
    margin-bottom:15px;
}

.project-card p{
    color:#555;
    line-height:1.8;
}


/* =================================
   ปุ่ม Back to Contents
   ================================= */

.btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    margin-top:25px;

    padding:14px 30px;

    color:white;

    text-decoration:none;

    font-size:16px;

    font-weight:bold;

    background:linear-gradient(
        135deg,
        #c084fc,
        #a855f7,
        #7e22ce
    );

    border:2px solid rgba(255,255,255,.7);

    border-radius:50px;

    box-shadow:
        0 8px 20px rgba(126,34,206,.3),
        0 0 15px rgba(168,85,247,.3);

    transition:all .3s ease;
}


/* ลูกศร */

.btn .arrow{
    font-size:25px;

    transition:
        transform .3s ease;
}


/* ตอนเอาเมาส์ชี้ */

.btn:hover{

    transform:
        translateY(-5px)
        scale(1.05);

    background:linear-gradient(
        135deg,
        #d8b4fe,
        #c084fc,
        #9333ea
    );

    box-shadow:
        0 12px 30px rgba(126,34,206,.4),
        0 0 30px rgba(168,85,247,.6);
}


/* ลูกศรขยับ */

.btn:hover .arrow{
    transform:translateX(-7px);
}


/* ตอนกด */

.btn:active{
    transform:scale(.95);
}

</style>
</head>

<body>

<!-- อิโมจิลอย -->

<div class="floating f1">🐰</div>
<div class="floating f2">💜</div>
<div class="floating f3">⭐</div>
<div class="floating f4">🌷</div>
<div class="floating f5">🪻</div>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="header-text">

            <h1>🐰 Portfolio 🐰</h1>

            <p>
                พื้นที่รวบรวมผลงานและกิจกรรมที่ภาคภูมิใจ 💜
            </p>

        </div>

    </div>


    <!-- ผลงาน 1 -->

    <div class="project-card">

        <h3>🐰 ผลงานชิ้นที่ 1</h3>

        <p>
            อธิบายรายละเอียดผลงาน วัตถุประสงค์ วิธีดำเนินงาน และสิ่งที่ได้รับ
        </p>

    </div>


    <!-- ผลงาน 2 -->

    <div class="project-card">

        <h3>🐰 ผลงานชิ้นที่ 2</h3>

        <p>
            อธิบายกิจกรรม การแข่งขัน หรือเกียรติบัตรที่ได้รับ
        </p>


        <!-- ปุ่มย้อนกลับ -->

        <a href="portfolio.html" class="btn">

            <span class="arrow">←</span>

            <span>Back to Contents</span>

        </a>

    </div>


</div>

</body>
</html>
