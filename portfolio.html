<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Contents</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f5e9ff,#e9d5ff,#d8b4fe);
    overflow:hidden;
}

/* อิโมจิลอย */
.floating{
    position:absolute;
    font-size:2rem;
    opacity:.7;
    animation:float 18s linear infinite;
}

@keyframes float{
    from{transform:translateY(120vh);}
    to{transform:translateY(-120vh);}
}

.f1{left:5%;animation-delay:0s;}
.f2{left:15%;animation-delay:2s;}
.f3{left:25%;animation-delay:4s;}
.f4{left:35%;animation-delay:6s;}
.f5{left:45%;animation-delay:8s;}
.f6{left:55%;animation-delay:10s;}
.f7{left:65%;animation-delay:12s;}
.f8{left:75%;animation-delay:14s;}
.f9{left:85%;animation-delay:16s;}

/* การ์ด */
.card{
    width:90%;
    max-width:800px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:40px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    z-index:10;
}

h1{
    color:#7e22ce;
    margin-bottom:25px;
    font-size:2.3rem;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.menu a{
    text-decoration:none;
    color:white;
    font-weight:bold;
    padding:16px;
    border-radius:20px;
    background:linear-gradient(135deg,#c084fc,#a855f7);
    transition:.3s;
    box-shadow:0 5px 15px rgba(126,34,206,.2);
}

.menu a:hover{
    transform:translateY(-4px) scale(1.03);
    background:linear-gradient(135deg,#d8b4fe,#9333ea);
}

/* ปุ่มย้อนกลับ */
.back{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top:30px;
    padding:14px 30px;
    color:white;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    background:linear-gradient(135deg,#c084fc,#a855f7,#7e22ce);
    border:2px solid rgba(255,255,255,.7);
    border-radius:50px;
    box-shadow:0 8px 20px rgba(126,34,206,.3);
    transition:.3s;
}

.back:hover{
    transform:translateY(-5px) scale(1.05);
    box-shadow:0 12px 30px rgba(126,34,206,.4);
}

.back .arrow{
    transition:.3s;
}

.back:hover .arrow{
    transform:translateX(-6px);
}
</style>

</head>
<body>

<div class="floating f1">🐰</div>
<div class="floating f2">💜</div>
<div class="floating f3">⭐</div>
<div class="floating f4">☁️</div>
<div class="floating f5">🌷</div>
<div class="floating f6">🪻</div>
<div class="floating f7">💖</div>
<div class="floating f8">⭐</div>
<div class="floating f9">🐰</div>

<div class="card">

<h1>🐰 Portfolio contents 🐰</h1>

<div class="menu">
    <a href="sop.html">SOP</a>
    <a href="profile.html">Profile</a>
    <a href="education.html">Education</a>
    <a href="portfolio2.html">Portfolio</a>
    <a href="activity.html">Activity</a>
    <a href="certificate.html">Certificates</a>
</div>

<a href="index.html" class="back">
    <span class="arrow">←</span>
    <span>Back to Home</span>
</a>

</div>

</body>
</html>
