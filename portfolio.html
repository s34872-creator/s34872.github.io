<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kantida Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;font-family:'Fredoka','Kanit',sans-serif}

body{
 min-height:100vh;display:grid;place-items:center;padding:25px;
 background:linear-gradient(135deg,#9379C2,#B19CD8,#CCB7E5,#D9C4EC,#E6D1F2);
 overflow:hidden;
}

body:before,body:after{
 content:"";position:fixed;border-radius:50%;filter:blur(90px);
 background:#fff8;width:300px;height:300px
}
body:before{top:-120px;left:-80px}
body:after{bottom:-130px;right:-80px}

.bunny{
 position:fixed;font-size:55px;animation:float 4s ease-in-out infinite
}
.b1{top:8%;left:6%}.b2{right:6%;bottom:8%;animation-delay:1s}

@keyframes float{50%{transform:translateY(-12px) rotate(5deg)}}

.card{
 width:min(100%,850px);padding:42px;
 text-align:center;background:#ffffff80;
 border:2px solid white;border-radius:38px;
 backdrop-filter:blur(20px);
 box-shadow:0 25px 60px #5b397733;
 position:relative;z-index:2
}

h1{
 color:#65447f;font-size:32px;margin-bottom:28px;
 text-shadow:0 4px 12px #5b397733
}
h1 span{color:#9379C2}

.menu{
 display:grid;grid-template-columns:repeat(3,1fr);gap:14px
}

.menu a,.back{
 padding:15px 10px;border-radius:22px;
 text-decoration:none;color:white;font-weight:500;
 background:linear-gradient(135deg,#9379C2,#B19CD8,#CCB7E5);
 border:2px solid white;
 box-shadow:0 8px 20px #76549e33;
 transition:.3s
}

.menu a:hover,.back:hover{
 transform:translateY(-4px) scale(1.03);
 box-shadow:0 12px 25px #76549e55
}

.contact{
 margin-top:18px;padding:15px;border-radius:22px;
 background:#fff9;color:#76549e;
 border:1px solid white
}

.back{
 display:inline-block;margin-top:22px;padding:13px 28px
}

.footer{
 margin-top:20px;color:#765A96;font-size:13px;letter-spacing:1px
}

@media(max-width:650px){
 .card{padding:30px 20px}
 .menu{grid-template-columns:repeat(2,1fr)}
 h1{font-size:27px}
}
</style>
</head>

<body>

<div class="bunny b1">🐰</div>
<div class="bunny b2">🐇</div>

<div class="card">

<h1>✦ <span>Portfolio</span> Contents 🐰</h1>

 <a href="certificate.html">📜 Certificates</a>
 <a href="university.html">🏫 University</a>
 <a href="contact.html">📞 Contact</a>
</div>

<div class="contact">

</div>

<a href="index.html" class="back">♡ ← Back to Home</a>

<div class="footer">✦ Make by <b>Kantida Khaow</b> ♡</div>

</div>

</body>
</html>
