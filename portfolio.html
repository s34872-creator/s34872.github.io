<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Contents - Warunee Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Fredoka', 'Kanit', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #fbf7ff 0%, #f3e8ff 50%, #e9d5ff 100%);
    overflow-x: hidden;
    position: relative;
    padding: 20px;
}

/* ตกแต่งพื้นหลังเรืองแสงละมุน */
body::before {
    content: "";
    position: fixed;
    width: 300px;
    height: 300px;
    background: #e9d5ff;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.5;
    top: 5%;
    left: 5%;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    width: 350px;
    height: 350px;
    background: #c084fc;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.25;
    bottom: 0;
    right: 5%;
    z-index: 0;
}

/* อิโมจิลอย */
.floating {
    position: absolute;
    font-size: 2rem;
    opacity: 0.55;
    filter: drop-shadow(0 4px 6px rgba(192, 132, 252, 0.15));
    animation: float 18s linear infinite;
    pointer-events: none;
}

@keyframes float {
    from { transform: translateY(110vh) rotate(0deg) scale(0.9); }
    to { transform: translateY(-110vh) rotate(360deg) scale(1.1); }
}

.f1 { left: 5%; animation-delay: 0s; }
.f2 { left: 15%; animation-delay: 2s; }
.f3 { left: 25%; animation-delay: 4s; }
.f4 { left: 35%; animation-delay: 6s; }
.f5 { left: 45%; animation-delay: 8s; }
.f6 { left: 55%; animation-delay: 10s; }
.f7 { left: 65%; animation-delay: 12s; }
.f8 { left: 75%; animation-delay: 14s; }
.f9 { left: 85%; animation-delay: 16s; }

/* การ์ด Glassmorphism ละมุน */
.card {
    width: 90%;
    max-width: 750px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 3px solid rgba(255, 255, 255, 0.9);
    border-radius: 40px;
    padding: 45px 35px;
    text-align: center;
    box-shadow: 
        0 20px 40px rgba(168, 85, 247, 0.08),
        0 2px 10px rgba(255, 255, 255, 0.8) inset;
    z-index: 10;
    position: relative;
}

h1 {
    color: #8b5cf6;
    margin-bottom: 30px;
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    filter: drop-shadow(0 2px 4px rgba(139, 92, 246, 0.15));
}

/* ปุ่มเมนู */
.menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.menu a {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 500;
    padding: 18px 20px;
    border-radius: 28px;
    background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
    border: 2px solid #ffffff;
    box-shadow: 
        0 10px 20px rgba(168, 85, 247, 0.18),
        0 0 0 3px rgba(233, 213, 255, 0.4);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-align: center;
}

.menu a:hover {
    transform: translateY(-5px) scale(1.02);
    background: linear-gradient(135deg, #d8b4fe 0%, #c084fc 100%);
    box-shadow: 
        0 14px 28px rgba(168, 85, 247, 0.28),
        0 0 0 5px rgba(233, 213, 255, 0.6);
}

.menu a:active {
    transform: translateY(0) scale(0.98);
}

/* ปุ่มย้อนกลับ */
.back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 32px;
    padding: 14px 32px;
    color: #ffffff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
    border: 3px solid #ffffff;
    border-radius: 50px;
    box-shadow: 
        0 10px 20px rgba(168, 85, 247, 0.25),
        0 0 0 4px rgba(233, 213, 255, 0.5);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.back:hover {
    transform: translateY(-4px) scale(1.03);
    background: linear-gradient(135deg, #d8b4fe 0%, #c084fc 100%);
    box-shadow: 
        0 14px 25px rgba(168, 85, 247, 0.35),
        0 0 0 6px rgba(233, 213, 255, 0.7);
}

.back .arrow {
    font-size: 18px;
    transition: transform 0.3s ease;
}

.back:hover .arrow {
    transform: translateX(-5px);
}

.back:active {
    transform: translateY(0) scale(0.97);
}

/* รองรับมือถือ */
@media (max-width: 600px) {
    .card {
        padding: 35px 20px;
        border-radius: 30px;
    }
    .menu {
        grid-template-columns: 1fr;
        gap: 12px;
    }
    h1 {
        font-size: 1.6rem;
    }
}
</style>

</head>
